# Defense in depth: Pi SRE filters tool exposure, this server is read-only,
# and Kubernetes credentials should also be bound to read-only RBAC.
read_only = true

toolsets = [
  "core",
  "config",
]

# Never expose kubeconfig content to the model.
disabled_tools = ["configuration_view"]

# Pi SRE Phase 1 further limits its model-facing tools to
# configuration_contexts_list. Cluster-dependent tools arrive in Phase 2.
