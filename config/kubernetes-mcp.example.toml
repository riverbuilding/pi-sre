# Defense in depth: Pi SRE filters tool exposure, this server is read-only,
# and Kubernetes credentials should also be bound to read-only RBAC.
read_only = true

# Generic resource presentation requires object output, never an arbitrary table.
list_output = "yaml"

# read_only alone permits Secret reads. RBAC must also exclude sensitive resources.
denied_resources = [{ group = "", version = "v1", kind = "Secret" }]

# Advertise conditional platform/metrics tools only when at least one target supports them.
experimental_enable_target_compatibility_tool_filters = true

toolsets = [
  "core",
  "config",
]

# Never expose kubeconfig content to the model.
disabled_tools = ["configuration_view"]

# Pi SRE exposes only approved diagnostics with one explicit validated context per call.
# Exact-set and live-* scope rules are application-enforced; each diagnostic
# call supplies one exact permitted context and requires no write capability.
# Keep multi-cluster support enabled; the server must enumerate contexts and
# declare an explicit context parameter for cluster-dependent operations.
