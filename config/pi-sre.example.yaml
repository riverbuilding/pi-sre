# Copy to ~/.pi-sre/config.yaml or pass its path with PI_SRE_CONFIG.
# This template intentionally enables diagnostic, read-only operation only.
kubernetes:
  # Startup defaults to live * when this explicit user choice and CLI choices are unset.
  # Phase 3 Slice 1 resolves sets/all; multi-target diagnostic routing awaits Slice 2.
  # Same choices as --clusters: exact names or sole quoted '*'; no duplicates.
  # Unknown exact names block initial selection without fallback. CLI overrides this rule.
  # contexts: [staging, production]
  # contexts: ["*"]
  mcp:
    transport: stdio
    command: kubernetes-mcp-server
    args: []
    # Relative paths resolve from this YAML file's directory.
    configFile: kubernetes-mcp.toml
    startupTimeoutMs: 15000
    toolCallTimeoutMs: 30000

investigation:
  defaultTimeRange: 30m
  maxToolCalls: 40

safety:
  mode: read-only

# Limits include the visible truncation notice. Item budget covers content blocks
# or all nested structured fields/array entries. Raw responses are not retained.
results:
  maxTextChars: 8000
  maxItems: 50
  rawRetention: disabled
